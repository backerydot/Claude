<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Хімія 8 клас: повторення 7 класу і програма 8 класу короткими уроками.">
  <meta name="theme-color" content="#fbfcfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111830" media="(prefers-color-scheme: dark)">
  <title>Хімія</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111830'/%3E%3Cpath d='M13 7h6M14 7v7l-6 10h16l-6-10V7' fill='none' stroke='%23ffe04a' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="chem.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Хімія, головна">
      <span class="brand-mark chem-mark" aria-hidden="true"></span>
      <span class="brand-name">Хімія</span>
    </a>
    <nav class="tabbar chem-tabs" aria-label="Розділи">
      <a class="tab" data-tab="home" href="#/"><span>Головна</span></a>
      <a class="tab" data-tab="lessons" href="#/lessons"><span>Уроки</span></a>
      <a class="tab" data-tab="table" href="#/table"><span>Таблиця</span></a>
      <a class="tab" data-tab="settings" href="#/settings"><span>Параметри</span></a>
    </nav>
    <span id="streak" class="streak-chip" role="img"></span>
  </header>

  <main id="app" class="app" tabindex="-1">
    <p class="muted">Завантаження…</p>
  </main>

  <script>
    setTimeout(function () {
      if (window.__chemStarted) return;
      document.getElementById('app').innerHTML =
        '<section class="error-box"><h1>Сайт не запустився</h1>' +
        '<p>Його треба відкривати через сервер: у папці проєкту <code>python3 -m http.server 8000</code>, ' +
        'потім <b>http://localhost:8000/chem/</b>.</p></section>';
    }, 2500);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
